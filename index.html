<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Sandbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <h1>CSS Sandbox</h1>
      <div class="spacer"></div>
      <div class="layout-group">
        <button class="layout-btn active" data-layout="top-bottom" title="Editors top, preview bottom">&#9776;</button>
        <button class="layout-btn" data-layout="left-right" title="Editors left, preview right">&#9783;</button>
        <button class="layout-btn" data-layout="tabs" title="Tabbed editors, preview below">&#9644;</button>
      </div>
      <label><input type="checkbox" id="auto-run" checked> Auto-run</label>
      <button id="btn-run">Run</button>
      <button id="btn-share">Share</button>
      <button id="btn-new" class="secondary">New</button>
      <button id="btn-reset" class="secondary">Reset layout</button>
    </div>
    <div id="workspace">
      <div id="tab-bar">
        <button class="tab-btn active" data-tab="panel-html">HTML</button>
        <button class="tab-btn" data-tab="panel-css">CSS</button>
        <button class="tab-btn" data-tab="panel-js">JS</button>
      </div>
      <div id="drag-overlay"></div>
      <div id="snap-preview"></div>
    </div>
  </div>
  <script src="lzstring.js"></script>
  <script src="highlight.js"></script>
  <script src="app.js"></script>
</body>
</html>
